apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /          # Hit this URL on the container
            port: 80         # On this port
          initialDelaySeconds: 5   # Wait 5 seconds before first check
                                   # (gives container time to start up)
          periodSeconds: 10        # Check every 10 seconds
          failureThreshold: 3      # Restart after 3 consecutive failures
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3   # Slightly faster - check readiness sooner
          periodSeconds: 5         # Check every 5 seconds
          failureThreshold: 2      # Stop traffic after 2 failures
